name: Build Unsigned IPA
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Archive
        run: |
          xcodebuild archive \
            -workspace ios/OmniLifeOS.xcworkspace \
            -scheme OmniLifeOS \
            -archivePath build/OmniLifeOS.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/OmniLifeOS.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r OmniLifeOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/OmniLifeOS.ipa
